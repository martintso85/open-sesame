name: Daily Taiwan Stock Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/main.yml"
  schedule:
    # 台北時間 16:30 第一版；21:30 完整版。
    - cron: "30 8 * * 1-5"
    - cron: "30 13 * * 1-5"

concurrency:
  group: taiwan-stock-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOP_N: ${{ github.event.schedule == '30 8 * * 1-5' && '40' || '80' }}
      HISTORY_TOP: ${{ github.event.schedule == '30 8 * * 1-5' && '40' || '80' }}
      HISTORY_WORKERS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Taiwan stock data
        run: python scripts/update_data.py

      - name: Verify generated data and indicators
        run: |
          python -m json.tool data/dashboard.json > /dev/null
          python -m unittest discover -s tests -v

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily Taiwan stock update"
            git pull --rebase origin main
            git push
          fi
