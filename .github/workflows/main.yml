name: Daily Taiwan Stock Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/main.yml"
  schedule:
    # 台北時間平日 16:30，避開盤後資料仍在陸續發布的時段。
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Taiwan stock data
        run: python scripts/update_data.py

      - name: Verify generated data and indicators
        run: |
          python -m json.tool data/dashboard.json > /dev/null
          python -m unittest discover -s tests -v

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily Taiwan stock update"
            git push
          fi
